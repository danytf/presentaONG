t-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Cruz Roja Española<\u002Fh2>\n  <div style=\"display:flex;gap:64px;flex:1;\">\n    <p style=\"flex:1.1;font-size:var(--type-body);color:var(--ink);line-height:1.55;font-weight:400;\">La red humanitaria más extensa de España, presente en las 52 provincias con nueve grandes áreas de intervención, desde emergencias hasta soledad no deseada. Forma parte de un movimiento internacional de 191 Sociedades Nacionales, y apoya a 31 de ellas en cooperación internacional.<\u002Fp>\n    <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:start;\">\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);\">1.285.834<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Socios y empresas<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);\">231.236<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Voluntarios<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);\">11.687.497<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Personas atendidas (2024)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);\">52<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Provincias con presencia<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: Cruz Roja Española · Memoria 2024<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Nuestro origen\" data-speaker-notes=\"El origen humaniza a la organización: nació de una idea muy simple, asistir a heridos sin importar bando.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Nuestro origen<\u002Fh2>\n  <div style=\"display:flex;gap:80px;flex:1;align-items:center;\">\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:120px;color:var(--red);line-height:1;\">1864<\u002Fdiv>\n      <p style=\"font-size:var(--type-body);color:var(--ink);line-height:1.55;margin-top:28px;max-width:640px;\">Heredera del movimiento que <b>Henri Dunant<\u002Fb> inició en Ginebra para asistir a heridos de guerra sin importar bando. España fue la séptima nación en adherirse al Convenio de Ginebra, y en 1870 envió su primera ayuda humanitaria internacional durante la guerra franco-prusiana.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Hoy<\u002Fdiv>\n        <p style=\"font-size:26px;color:var(--ink);font-weight:600;margin-top:10px;line-height:1.4;\">191 Sociedades Nacionales de Cruz Roja y Media Luna Roja en el mundo; España apoya a 31 en cooperación internacional.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Principio de neutralidad<\u002Fdiv>\n        <p style=\"font-size:26px;color:var(--ink);font-weight:600;margin-top:10px;line-height:1.4;\">Puede operar en Gaza, Ucrania y Sudán porque no toma partido ni financia ejércitos: es el único \"pasaporte\" que permite trabajar con todas las partes de un conflicto.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"El reto: la vulnerabilidad hoy\" data-speaker-notes=\"Contextualizar la magnitud del problema antes de hablar de soluciones: cuatro formas de vulnerabilidad.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 10% -14%,rgba(245,51,63,.12),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--dark-text);margin-bottom:12px;\">El reto: la vulnerabilidad hoy<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--dark-muted);font-weight:500;margin-bottom:var(--gap-title);max-width:1500px;\">Cualquier persona puede pasar de una vida normal a una situación de gran vulnerabilidad. Adopta cuatro grandes formas.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:32px;flex:1;align-items:start;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--red);\">200+<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">fallecidos y 78 municipios afectados por la DANA de Valencia (2024): grandes emergencias<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--red);\">5 M<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">de personas se sienten solas en España: la soledad de las personas mayores<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--red);\">933.514<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">personas en pobreza, sinhogarismo o aislamiento en 2024: la exclusión social<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--red);\">33 M+<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">de personas necesitan ayuda humanitaria en Sudán en 2026: las crisis internacionales<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid rgba(255,255,255,.12);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--dark-muted);font-weight:600;\">Cruz Roja trabaja en España en 9 grandes áreas y en cooperación internacional en 41 países.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Nueve áreas de actuación\" data-speaker-notes=\"Mapa general de qué hace Cruz Roja, antes de entrar programa por programa.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">Nueve áreas de actuación<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1500px;\">Más cooperación internacional en 41 países. En un solo día, Cruz Roja puede estar en todas ellas a la vez.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;align-content:start;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">🚨 Emergencias<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">🧑‍🦳 Personas mayores<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">🧒 Infancia y juventud<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">💼 Empleo<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">❤️ Salud<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">🤝 Inclusión social<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">🌍 Migración<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">🌱 Medio ambiente<\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 30px;font-size:26px;font-weight:700;color:var(--ink);\">📚 Educación<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cruz Roja en cifras\" data-speaker-notes=\"Las cuatro cifras que resumen la escala de la organización.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">Cruz Roja en cifras<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1400px;\">Datos consolidados de la Memoria 2024<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--red-deep);\">11.687.497<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">personas atendidas en 2024, en España y en 41 países<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--red-deep);\">1.285.834<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">socios y empresas colaboradoras<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--red-deep);\">231.236<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">voluntarios en toda España<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--red-deep);\">1.096,6 M€<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">presupuesto consolidado 2026<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">11.687.497 = 2.786.628 en el ámbito nacional + 7.295.659 internacional (41 países) + 1.605.210 en sensibilización. Fuente: Cruz Roja Española · Memoria 2024<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A quién atendemos\" data-speaker-notes=\"Un vistazo a las áreas de mayor volumen; las categorías no son excluyentes entre sí.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">A quién atendemos<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);\">Cuatro de las áreas de mayor volumen, en personas atendidas durante 2024<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;border-top:6px solid var(--red);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);\">1.177.803<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:14px;line-height:1.35;\">en el área de Salud<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;border-top:6px solid var(--red);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);\">933.514<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:14px;line-height:1.35;\">en programas de Inclusión Social<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;border-top:6px solid var(--red);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);\">225.010<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:14px;line-height:1.35;\">mayores y cuidadoras con teleasistencia<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;border-top:6px solid var(--red);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);\">152.564<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:14px;line-height:1.35;\">niños, niñas y adolescentes<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Las categorías no son excluyentes: una persona puede recibir varios tipos de apoyo a la vez.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cómo nos financiamos\" data-speaker-notes=\"El peso de las subvenciones públicas frente a la financiación privada y flexible.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Cómo nos financiamos<\u002Fh2>\n  <div style=\"display:flex;gap:64px;flex:1;align-items:flex-start;margin-top:56px;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:28px;\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:60px;color:var(--red-deep);width:300px;white-space:nowrap;\">976 M€<\u002Fdiv>\n        <div style=\"font-size:26px;color:var(--ink);font-weight:600;\">de ingresos totales en 2024<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:20px;\">\n        <div style=\"fon ide a ellos: más del 80% son mujeres.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Salud y cuidados<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">SerCuidadorA<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1400px;\">Apoyo a quienes cuidan sin que nadie les cuide a ellos: en más del 80% de los casos, una mujer, a menudo sola<\u002Fp>\n  <div style=\"display:flex;gap:64px;flex:1;align-items:flex-start;margin-top:56px;\">\n    <div style=\"flex:0.6;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:100px;color:var(--red-deep);line-height:1;\">Desde 1997<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:16px;\">Multicanal SerCuidadorA desde 2007: web, teléfono gratuito, email y WhatsApp, 24 horas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:3px solid var(--red);padding-left:36px;\">\n      <p style=\"font-size:25px;color:var(--ink);line-height:1.55;\">Formación en cuidados básicos, servicio de respiro (una persona voluntaria releva al cuidador) y grupos de apoyo entre personas en situación similar. Cruz Roja recuerda que cuidar bien empieza por cuidarse a uno mismo, y nadie debería tener que hacerlo en soledad.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divisor · Acción internacional\" data-speaker-notes=\"41 países, 191 Sociedades Nacionales: la cooperación internacional de Cr ius:100px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px;\"><span>Empleo<\u002Fspan><span>52,1 M€ · 4,8%<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:100px;height:26px;overflow:hidden;\"><div style=\"background:#FA8F95;height:100%;width:4.8%;border-radius:100px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px;\"><span>Socorros y emergencias<\u002Fspan><span>50,6 M€ · 4,7%<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:100px;height:26px;overflow:hidden;\"><div style=\"background:#FA8F95;height:100%;width:4.7%;border-radius:100px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px;\"><span>Cooperación internacional<\u002Fspan><span>27,8 M€ · 2,6%<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:100px;height:26px;overflow:hidden;\"><div style=\"background:#FBADB2;height:100%;width:2.6%;border-radius:100px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px;\"><span>Salud<\u002Fspan><span>24,1 M€ · 2,2%<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:100px;height:26px;overflow:hidden;\"><div style=\"background:#FBADB2;height:100%;width:2.2%;border-radius:100px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:20px;margin-top:12px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Estas y otras 4 áreas (Formación, Juventud, Desarrollo local, Medio ambiente) suman el 86% del presupuesto de gasto 2026 (1.087,1 M€). El resto se destina a transformación, soporte, financiación y gobernanza.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cuentas claras\" data-speaker-notes=\"Origen de los ingresos: subvenciones públicas frente a financiación privada y cuotas de socios.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Transparencia<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">Cuentas claras<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1400px;\">Origen de los 976 M€ de ingresos en 2024, según las Cuentas Anuales auditadas<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--red-deep);\">51%<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">Subvenciones públicas (502 M€)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--red-deep);\">49%<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">Financiación privada y propia (227,6 M€ de fuentes privadas)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--red-deep);\">69%<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">de lo privado son cuotas de socios (157,9 M€)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--red-deep);\">1.096,6 M€<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">presupuesto consolidado 2026<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">El 74% del presupuesto va a trabajar por las personas y por las causas (X Asamblea General). Fuente: Cruz Roja Española · Informe de Auditoría de Cuentas Anuales 2024<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divisor · Argumentario de captación\" data-speaker-notes=\"Cómo transmitir todo lo anterior en una conversación de minuto y medio.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(245,51,63,.14),transparent 58%),var(--dark-bg);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--dark-bg-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">11<\u002Fspan>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 11<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--dark-text);letter-spacing:-.02em;max-width:1300px;\">Argumentario de captación<\u002Fh2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:28px;max-width:1100px;\">Todo lo que hemos visto, en una conversación de minuto y medio.<\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:26px;height:7px;border-radius:4px;background:var(--red);\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Por qué hacerse socio (I)\" data-speaker-notes=\"Tres razones de peso para diferenciar a Cruz Roja de otras opciones de donación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Por qué hacerse socio (I)<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;flex:1;\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);flex-shrink:0;\">1<\u002Fdiv>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">La red más completa<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">Ninguna otra organización cubre el mismo espectro. En un solo día, Cruz Roja puede estar atendiendo a una víctima de violencia de género en Madrid e instalando placas solares en Sevilla, a la vez.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);flex-shrink:0;\">2<\u002Fdiv>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">161 años de historia, convertidos en capacidad real<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">En la DANA, mientras sus propias sedes quedaban destruidas, ya tenía a 6.019 personas en el terreno. Esa capacidad existe porque entrena a 231.236 voluntarios todo el año, no solo en emergencias.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);flex-shrink:0;\">3<\u002Fdiv>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">Tu cuota es el motor real<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">El 69% de lo que Cruz Roja capta de fuentes privadas viene de las cuotas de socios: más que la lotería, las rifas y el Gran Premio del Oro juntos.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Por qué hacerse socio (II)\" data-speaker-notes=\"Neutralidad y cercanía: dos razones más.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Por qué hacerse socio (II)<\u002Fh2>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:flex-start;\">\n    <div style=\"flex:1;display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);flex-shrink:0;\">4<\u002Fdiv>\n      <div><div style=\"font-size:27px;font-weight:700;color:var(--ink);\">Principio de neutralidad<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.45;\">Cruz Roja puede operar en Gaza, Ucrania y Sudán porque no toma partido. Sin ese principio, y sin socios que lo financien, la cooperación internacional desaparece.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--red-deep);flex-shrink:0;\">5<\u002Fdiv>\n      <div><div style=\"font-size:27px;font-weight:700;color:var(--ink);\">Cercanía, incluso en soledad<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.45;\">La teleasistencia llega a más de 132.000 personas mayores. En zonas rurales o aisladas, Cruz Roja es a menudo el único recurso disponible, 24 horas, 365 días al año.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cómo contarlo: el guion de captación\" data-speaker-notes=\"El gancho inicial pide permiso y promete brevedad: minuto y medio.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 10% -14%,rgba(245,51,63,.1),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;\">Argumentario · El guion<\u002Fdiv>\n  <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:56px;color:var(--dark-text);line-height:1.3;max-width:1550px;\">\"Oye, ¿tienes un minuto y medio? Quiero contarte el día de alguien que no conoces, pero que seguro reconoces.\"<\u002Fp>\n  <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:44px;max-width:1300px;\">Así empieza el discurso de captación: pide permiso, promete brevedad y anuncia una historia, no una lista de cifras.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"El relato, paso a paso\" data-speaker-notes=\"El discurso recorre un día cualquiera, tocando cada área de Cruz Roja a través de una sola persona.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(245,51,63,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario · El guion<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">El relato, paso a paso<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:0;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--red);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--red-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">8 de la mañana<\u002Fdiv>\n      <div style=\"font-size:25px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Teleasistencia<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Una mujer de 84 años tiene un mareo, pulsa el botón y responde una persona real. Más de 132.000 personas mayores lo tienen, 24 horas, 365 días al año.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--red);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--red-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">10 de la mañana<\u002Fdiv>\n      <div style=\"font-size:25px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Acompañamiento hospitalario<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Una voluntaria juega con un niño antes de su operación. El año pasado acompañaron así a más de 38.000 niños y niñas.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--red);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--red-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Mediodía<\u002Fdiv>\n      <div style=\"font-size:25px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Empleo<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Currículum, entrevistas con simulador de IA y ofertas reales. El año pasado, más de 280.000 personas pasaron por estos programas.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--red);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--red-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Por la tarde<\u002Fdiv>\n      <div style=\"font-size:25px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">ATENPRO<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Una mujer que ha sufrido violencia de género recibe seguimiento con GPS. Más de 26.000 mujeres tienen acceso a este apoyo.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--red);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--red-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Por la noche<\u002Fdiv>\n      <div style=\"font-size:25px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Salud mental<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Alguien con ansiedad llama a un teléfono gratuito. Casi 1,2 millones de personas recibieron apoyo del área de Salud el año pasado.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Un mismo día, una sola persona, cada área de Cruz Roja: el relato conecta cifra y vida real.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"El cierre y la llamada a la acción\" data-speaker-notes=\"El cierre invita a formar parte, con una cuota concreta y accesible.\" style=\"display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(1300px 850px at 10% -14%,rgba(245,51,63,.1),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);text-align:center;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--red);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;\">Argumentario · El cierre<\u002Fdiv>\n  <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:44px;color:var(--dark-text);line-height:1.4;max-width:1550px;\">\"Todo esto sigue pasando hoy, mientras hablamos. Y solo sigue pasando porque hay gente que decide formar parte de esa red.\"<\u002Fp>\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-top:56px;\">\n    <div style=\"font-family
