idden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--dark-bg-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">01<\u002Fspan>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 01<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--dark-text);letter-spacing:-.02em;max-width:1300px;\">Quiénes somos<\u002Fh2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:28px;max-width:1150px;\">Origen, misión y el reto de la leucemia que la Fundación trabaja para cerrar.<\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:26px;height:7px;border-radius:4px;background:var(--orange-vivid);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Quiénes somos\" data-screen-label=\"04\" data-speaker-notes=\"Fundada por Josep Carreras tras superar una leucemia; hoy gestiona el REDMO por mandato del Ministerio de Sanidad e impulsa investigación propia.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Fundación Josep Carreras contra la Leucemia<\u002Fh2>\n  <div style=\"display:flex;gap:64px;flex:1;align-items:center;\">\n    <p style=\"flex:1.1;font-size:var(--type-body);color:var(--ink);line-height:1.55;font-weight:400;\">Fundada en 1988 por Josep Carreras, tenor superviviente de una leucemia curada gracias a un trasplante de médula ósea en 1987. Hoy cubre todo el recorrido de la enfermedad: gestiona el REDMO (único registro oficial de donantes de médula de España, por mandato del Ministerio de Sanidad) e impulsa investigación a través del Instituto de Investigación contra la Leucemia Josep Carreras, además de acompañar a pacientes y familias.<\u002Fp>\n    <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:center;\">\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);\">1988<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Fundada por Josep Carreras<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);\">520.508<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Donantes activos en el REDMO<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);\">+155.000<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Socios en toda España<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);\">794<\u002Fdiv>\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Trasplantes coordinados en 2025<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: FJC · Memoria de Actividades 2024 / REDMO · Memoria de Impacto 2025<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Nuestro origen\" data-screen-label=\"05\" data-speaker-notes=\"El origen humaniza a la organización: Josep Carreras convirtió su propia enfermedad en la Fundación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Nuestro origen<\u002Fh2>\n  <div style=\"display:flex;gap:80px;flex:1;align-items:center;\">\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:104px;color:var(--orange);line-height:1;\">1987 → 1988<\u002Fdiv>\n      <p style=\"font-size:var(--type-body);color:var(--ink);line-height:1.55;margin-top:28px;max-width:640px;\">En 1987, un trasplante de médula ósea le devolvió la vida a <b>Josep Carreras<\u002Fb> tras superar una leucemia. En la habitación de al lado había un bebé de dos años: la sensación de injusticia (él ya había vivido décadas enteras) le impulsó a fundar, un año después, la entidad que lleva su nombre. En 1991 creó el <b>REDMO<\u002Fb>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Presidencia actual<\u002Fdiv>\n        <p style=\"font-size:26px;color:var(--ink);font-weight:600;margin-top:10px;line-height:1.4;\">Josep Carreras sigue siendo hoy el presidente de la Fundación que fundó hace más de 35 años.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">En sus palabras<\u002Fdiv>\n        <p style=\"font-size:26px;color:var(--ink);font-weight:600;margin-top:10px;line-height:1.4;\">“Me planteé un objetivo: conseguir que, algún día, la leucemia fuese una enfermedad curable en todos los casos.” Hasta que la curemos, no pararemos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"El problema — la leucemia en España\" data-screen-label=\"06\" data-speaker-notes=\"Contextualizar el problema antes de hablar de soluciones: incidencia, supervivencia y la dificultad de encontrar donante.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 10% -14%,rgba(255,105,0,.12),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--dark-text);margin-bottom:12px;\">El problema — la leucemia en España<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--dark-muted);font-weight:500;margin-bottom:var(--gap-title);max-width:1550px;\">Encontrar un donante compatible, y curar los casos que hoy no se curan, es la doble carrera contra reloj en la que trabaja la Fundación.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:32px;flex:1;align-items:start;align-content:center;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--orange-vivid);\">6.400<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">casos de leucemia diagnosticados cada año en España, además de 11.500 linfomas y 3.000 mieloma múltiple<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--orange-vivid);\">3 de cada 4<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">pacientes no tienen un familiar compatible: dependen de encontrar a un desconocido<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--orange-vivid);\">2 de cada 10<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">niños con leucemia que no superan la enfermedad; en adultos la supervivencia es del 50%<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:56px;color:var(--orange-vivid);\">1/3.500<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);font-weight:600;margin-top:12px;line-height:1.4;\">probabilidad de que dos personas no emparentadas sean compatibles<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid rgba(255,255,255,.12);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--dark-muted);font-weight:600;\">La leucemia es el cáncer infantil más frecuente: un 30% de todos los cánceres en edad pediátrica. Fuente: FJC · Memoria de Actividades 2024 / REDMO · Memoria de Impacto 2025<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Destino de los fondos\" data-screen-label=\"07\" data-speaker-notes=\"Desglose oficial de la Memoria 2024: casi tres cuartas partes van directas a búsqueda de donante e investigación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:8px;\">Destino de los fondos<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1500px;\">57,3 M€ de recursos totales en 2024. Así se destinaron:<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center;\">\n    <div style=\"display:flex;\">\n      <div style=\"width:38.1%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:var(--orange-vivid);\">38%<\u002Fdiv>\n      <div style=\"width:35.4%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:#E0791F;\">35%<\u002Fdiv>\n      <div style=\"width:9.9%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:var(--cyan-deep);\">10%<\u002Fdiv>\n      <div style=\"width:9.6%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:#4A9F6E;\">10%<\u002Fdiv>\n      <div style=\"width:7%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:#8d8b86;\">7%<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;border-radius:16px;overflow:hidden;height:64px;box-shadow:var(--shadow-card);\">\n      <div style=\"width:38.1%;background:var(--orange-vivid);\"><\u002Fdiv>\n      <div style=\"width:35.4%;background:#E0791F;\"><\u002Fdiv>\n      <div style=\"width:9.9%;background:var(--cyan-deep);\"><\u002Fdiv>\n      <div style=\"width:9.6%;background:#4A9F6E;\"><\u002Fdiv>\n      <div style=\"width:7%;background:#8d8b86;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:20px;\">\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--orange-vivid);margin-right:8px;\"><\u002Fspan><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Búsqueda de donante y trasplante<\u002Fspan><\u002Fdiv>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#E0791F;margin-right:8px;\"><\u002Fspan><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Investigación — Instituto Josep Carreras<\u002Fspan><\u002Fdiv>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--cyan-deep);margin-right:8px;\"><\u002Fspan><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Estructura y gestión del REDMO<\u002Fspan><\u002Fdiv>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#4A9F6E;margin-right:8px;\"><\u002Fspan><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Administración y captación<\u002Fspan><\u002Fdiv>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#8d8b86;margin-right:8px;\"><\u002Fspan><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Sensibilización<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: FJC · Memoria de Actividades 2024, \"Destino de los recursos\"<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Diez programas, cuatro frentes\" data-screen-label=\"08\" data-speaker-notes=\"Mapa general de qué hace la FJC, agrupado en cuatro frentes, antes de entrar programa por programa.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">Diez programas, cuatro frentes<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1500px;\">Del registro de donantes al laboratorio, y de vuelta al paciente, en un mismo sistema.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:18px;flex:1;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:24px 22px;\"><div style=\"font-size:24px;font-weight:700;color:var(--ink);\">🩸 REDMO y donación de médula<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.4;\">Registro oficial · Proceso de donación · Red WMDA y cordón umbilical<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:24px 22px;\"><div style=\"font-size:24px;font-weight:700;color:var(--ink);\">🔬 Investigación y ciencia<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.4;\">Instituto Josep Carreras · Avances científicos · Spin-offs y alianzas<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:24px 22px;\"><div style=\"font-size:24px;font-weight:700;color:var(--ink);\">🏠 Apoyo al paciente y familias<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.4;\">Pisos de Acogida · Experiencia del Paciente<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:24px 22px;\"><div style=\"font-size:24px;font-weight:700;color:var(--ink);\">🤝 Comunidad y sensibilización<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.4;\">Comunidad Imparable · Herencias y red internacional<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--dark-bg);border-radius:20px;box-shadow:var(--shadow-card-dark);padding:24px 22px;display:flex;flex-direction:column;justify-content:center;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-vivid);\">10<\u002Fdiv><div style=\"font-size:24px;color:var(--dark-muted);margin-top:6px;\">programas activos en 2025<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divisor · REDMO y donación de médula\" data-screen-label=\"09\" data-speaker-notes=\"Segunda sección: el registro oficial de donantes de médula, y cómo funciona el proceso de donación.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(255,105,0,.14),transparent 58%),var(--dark-bg);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--dark-bg-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">02<\u002Fspan>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 02<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--dark-text);letter-spacing:-.02em;max-width:1300px;\">REDMO y donación de médula<\u002Fh2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:28px;max-width:1200px;\">El único registro oficial de donantes de médula ósea de España, y cómo se dona.<\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:26px;height:7px;border-radius:4px;background:var(--orange-vivid);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"REDMO — el registro oficial\" data-screen-label=\"10\" data-speaker-notes=\"520.508 donantes, 794 trasplantes, 26 días de mediana; acreditación Full Standard de la WMDA.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">REDMO y donación de médula<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">REDMO — el registro oficial de médula ósea<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1550px;\">Creado por la Fundación en 1991 para cubrir un vacío crítico. Integrado en el Sistema Nacional de Salud desde 1994, por mandato del Ministerio de Sanidad.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">520.508<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">donantes activos (5.º Europa / 13.º mundo)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">794<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">trasplantes coordinados en 2025<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">26 días<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">mediana de búsqueda (84% antes de 60 días)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">15.435<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">vidas transformadas desde 1991<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">En 2024 el REDMO obtuvo la acreditación Full Standard de la WMDA, la máxima certificación mundial en calidad y seguridad. España alcanzó un 27% de autoabastecimiento en 2025 (trasplantes con donante español, frente al 3% de 2012). En mayo de 2026, 1.083 pacientes seguían activos en el REDMO buscando donante en ese mismo momento. Convenios autonómicos activos: Castilla y León (5,69 M€), Baleares (3,7 M€), Galicia (885.000 €), entre otros. Fuente: REDMO · Memoria de Impacto 2025 / Plan Nacional de Médula Ósea<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Proceso de donación\" data-screen-label=\"11\" data-speaker-notes=\"Gratuito, sin compromiso previo, y sin cirugía en 8 de cada 10 casos.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">REDMO y donación de médula<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Proceso de donación<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">Gratuito<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">todos los gastos cubiertos, sin compromiso previo<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">81%<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">se dona sin cirugía, por aféresis (9% médula ósea, 9% linfocitos)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">1/3.500<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">probabilidad de compatibilidad no emparentada<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">18-40<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">perfil más demandado clínicamente: varón joven<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Para informarse o inscribirse como donante: 900 32 33 34. Fuente: REDMO · fcarreras.org<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Red WMDA y cordón umbilical\" data-screen-label=\"12\" data-speaker-notes=\"España es el 1º de Europa y el 3º del mundo en unidades de sangre de cordón umbilical.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">REDMO y donación de médula<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Red WMDA y cordón umbilical — España, 1.º de Europa<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">30+<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">países conectados en la red mundial de donantes<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">270<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">donaciones enviadas al extranjero en 2025<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">60.886<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">unidades de sangre de cordón umbilical<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">1.º / 3.º<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">de Europa y del mundo en unidades SCU disponibles<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style= hivo',sans-serif;font-weight:700;font-size:44px;color:var(--ink);\">16<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:12px;line-height:1.35;\">postdocs en el programa CarrerasLeaders (36 meses)<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;color:var(--ink);\">300.000 €<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:12px;line-height:1.35;\">Beca Josep Carreras 2026, con GETH-TC<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Estudio en Nature sobre la proteína SIRT7 (con Mass General Brigham); descubierto un subtipo de linfoma 4 veces más letal en mujeres. Nuevo secuenciador MiSeq i100 financiado por los socios. Fuente: Instituto Josep Carreras · Notas de prensa 2025-2026<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Spin-offs y alianzas internacionales\" data-screen-label=\"16\" data-speaker-notes=\"Dos spin-offs con ensayo clínico activo; 50 años del primer trasplante alogénico en junio de 2026.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación y ciencia<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Spin-offs y alianzas internacionales<\u002Fh2>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:stretch;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-size:var(--type-small);color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;\">Spin-offs — del laboratorio al paciente<\u002Fdiv>\n      <p style=\"font-size:26px;color:var(--ink);font-weight:500;line-height:1.5;\"><b>OneChain:<\u002Fb> primer paciente tratado con su terapia CAR-T en mayo de 2024.<br><b>Leukos Biotech:<\u002Fb> primer paciente con su fármaco AOP208 en octubre de 2024.<\u002Fp>\n      <p style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:20px;\">2 spin-offs del Instituto con ensayo clínico activo hoy.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-size:var(--type-small);color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;\">Alianzas internacionales<\u002Fdiv>\n      <p style=\"font-size:26px;color:var(--ink);font-weight:500;line-height:1.5;\">Alianza <b>IGTP-ICO Can Ruti<\u002Fb> (+100 profesionales) y alianza con <b>China<\u002Fb> (proyecto ACHILLES, formación europea en hemato-oncología).<\u002Fp>\n      <p style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:20px;\">50 años del primer trasplante alogénico (Clínic, junio 2026), con Josep Carreras presente. Congreso EHA 2026 en Estocolmo: 13 abstracts y premio a la excelencia clínica para el Dr. Ribera. Proyecto conjunto sobre leucemia T-ALL con la fundación hermana alemana.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divisor · Apoyo al paciente y familias\" data-screen-label=\"17\" data-speaker-notes=\"Cuart ta-speaker-notes=\"9 pisos y 5 hoteles gratuitos en Barcelona; 105 familias acogidas en 2024.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 10% -14%,rgba(255,105,0,.12),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Apoyo al paciente y familias<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--dark-text);margin-bottom:var(--gap-title);max-width:1500px;\">Pisos de Acogida — un hogar lejos de casa<\u002Fh2>\n  <div style=\"display:flex;gap:56px;flex:1;align-items:center;\">\n    <div style=\"flex:1.1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:88px;color:var(--orange-vivid);line-height:1;\">9 pisos + 5 hoteles<\u002Fdiv>\n      <p style=\"font-size:26px;color:var(--dark-muted);font-weight:500;margin-top:20px;line-height:1.5;\">gratuitos, en Barcelona (Clínic, Sant Pau, Vall d'Hebron, ICO-Duran i Reynals, ICO-Badalona), para pacientes que deben desplazarse y sus cuidadores durante un trasplante o un tratamiento CAR-T. Ninguna familia debe elegir entre estar cerca o pagar el alquiler de su casa.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:0.9;display:flex;flex-direction:column;gap:20px;align-self:stretch;\">\n      <div style=\"flex:1;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-card-dark);min-height:220px;background:var(--paper-2);\">\n        <img src=\"1c8f91f8-9f79-4ea4-8107-f383222cd098\" alt=\"Piso de acogida\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.06);border-radius:24px;padding:28px;\">\n        <div style=\"font-size:24px;color:var(--orange-vivid);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;\">En cifras<\u002Fdiv>\n        <p style=\"font-size:24px;color:var(--dark-text);font-weight:500;line-height:1.45;\">105 familias acogidas en 2024 (+48%), evitando gastos que pueden superar los 19.947 € por estancia.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Programa de Experiencia del Paciente\" data-screen-label=\"19\" data-speaker-notes=\"Más de 22.000 consultas médicas y 22.000 informativas; el estudio EICR crónica muestra el impacto real de un trasplante.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Apoyo al paciente y familias<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">Programa de Experiencia del Paciente<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1550px;\">Información de rigor y respuesta a dudas médicas, en cada etapa del proceso.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">22.000<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">consultas médicas resueltas desde 2010<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">22.000<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">consultas informativas resueltas desde 2010<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">88%→22%<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">tasa de empleo antes/después de un trasplante (estudio EICR crónica)<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-stat-md);color:var(--orange-deep);\">82%<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:10px;\">de los cuidadores con impacto en su vida laboral<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Programas CORAL y EICR 360º; consultas médicas 24h/365 con el Dr. Enric Carreras (~1.500/año, 16 consultas informativas/día laborable). Podcast Imparables. España aprobó en 2023 la Ley del Derecho al Olvido Oncológico. Fuente: FJC · Estudio europeo sobre el impacto de la EICR crónica (feb. 2026)<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divisor · Comunidad y sensibilización\" data-screen-label=\"20\" data-speaker-notes=\"Quinta sección: más de 155.000 socios, y una red que ya no cabe solo en España.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(255,105,0,.14),transparent 58%),var(--dark-bg);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--dark-bg-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">05<\u002Fspan>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 05<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--dark-text);letter-spacing:-.02em;max-width:1300px;\">Comunidad y sensibilización<\u002Fh2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:28px;max-width:1200px;\">Más de 155.000 socios, y una red que ya no cabe solo en España.<\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:26px;height:7px;border-radius:4px;background:var(--orange-vivid);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Comunidad Imparable\" data-screen-label=\"21\" data-speaker-notes=\"Más de 155.000 socios y 900 empresas colaboradoras; el Día de los Imparables reunió a más de 1.700 personas en Bilbao.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(107,192,72,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--green);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Comunidad y sensibilización<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Comunidad Imparable<\u002Fh2>\n  <div style=\"display:flex;gap:64px;flex:1;align-items:center;\">\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:120px;color:var(--green);line-height:1;\">+155.000<\u002Fdiv>\n      <p style=\"font-size:var(--type-body);color:var(--ink);line-height:1.55;margin-top:28px;max-width:640px;\">socios sostienen la Fundación con una cuota media de 38,23 €, y más de 900 empresas colaboran cada año (Banco Santander, OnCodines Trail: 303.733 €). Campañas de sensibilización alcanzan a 7,5 millones de personas al año. El Día de los Imparables 2026 (Bilbao) reunió a más de 1.700 participantes.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:0.85;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-card);align-self:stretch;\">\n      <img src=\"50f20318-7c31-4547-8cdf-3362a21402d5\" alt=\"Comunidad Imparable\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Herencias, legados y red internacional\" data-screen-label=\"22\" data-speaker-notes=\"La red internacional de fundaciones hermanas, y cómo herencias concretas financian pisos e investigación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(107,192,72,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--green);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Comunidad y sensibilización<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Herencias, legados y red internacional<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;border-top:6px solid var(--green);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--ink);\">18,5 M€<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:12px;line-height:1.35;\">recaudados en cuotas regulares de socios<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;border-top:6px solid var(--green);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--ink);\">525<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:12px;line-height:1.35;\">iniciativas solidarias de particulares y empresas<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;border-top:6px solid var(--green);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--ink);\">40 M+<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:12px;line-height:1.35;\">donantes mundiales conectados vía la red WMDA del REDMO<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;border-top:6px solid var(--green);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--ink);\">Match Tour<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:12px;line-height:1.35;\">\"Un match x una vida\" recorre ciudades de España con el Ministerio de Sanidad<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Herencias y legados: el de Concepción financió el primer piso de acogida (155 pacientes); el de Natividad, un citómetro FACS ARIA para el Instituto. La fundación hermana alemana recaudó 250 M€ en 31 galas de TV (1.552 proyectos); red también en Suiza (SWISSCORD) y Seattle (cátedra Fred Hutch). Fuente: FJC · Herencias y legados solidarios<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divisor · Argumentario de captación\" data-screen-label=\"23\" data-speaker-notes=\"Sexta sección: cómo transmitir todo lo anterior en una conversación de minuto y medio.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(255,105,0,.14),transparent 58%),var(--dark-bg);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--dark-bg-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">06<\u002Fspan>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 06<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--dark-text);letter-spacing:-.02em;max-width:1300px;\">Argumentario de captación<\u002Fh2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:28px;max-width:1200px;\">Cómo transmitir todo lo anterior en una conversación de minuto y medio.<\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);\"><\u002Fspan><span style=\"width:26px;height:7px;border-radius:4px;background:var(--orange-vivid);\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Por qué hacerse socio (I)\" data-screen-label=\"24\" data-speaker-notes=\"Tres razones de peso: quien lo vivió en primera persona, el ciclo completo, y un hogar cuando más se necesita.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Por qué hacerse socio (I)<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;flex:1;justify-content:center;\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);flex-shrink:0;\">1<\u002Fdiv>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">Creada por quien vivió en sus carnes lo que hoy financia<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">Josep Carreras sobrevivió a una leucemia gracias a un trasplante de médula ósea en 1987. Al año siguiente fundó la entidad; en 1991 creó el REDMO para que nadie más pasara por lo que él pasó sin, al menos, una oportunidad real de encontrar donante.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);flex-shrink:0;\">2<\u002Fdiv>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">El único ciclo completo, de principio a fin<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">El REDMO conecta donantes con pacientes. El Instituto (el más grande de Europa en leucemia, calificado con la máxima nota) investiga nuevas terapias, y sus spin-offs las llevan a ensayos clínicos reales.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);flex-shrink:0;\">3<\u002Fdiv>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">Un hogar cuando más se necesita<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">Los pacientes que deben desplazarse a Barcelona para un trasplante o un CAR-T, junto con sus cuidadores, tienen alojamiento gratuito. En 2025 la red acogió a 102 familias.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Por qué hacerse socio (II)\" data-screen-label=\"25\" data-speaker-notes=\"El mandato oficial del Estado, y la pertenencia a una red internacional de fundaciones hermanas.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Por qué hacerse socio (II)<\u002Fh2>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:center;justify-content:center;\">\n    <div style=\"flex:1;display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;border-top:5px solid var(--cyan-deep);\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--cyan-deep);flex-shrink:0;\">4<\u002Fdiv>\n      <div><div style=\"font-size:27px;font-weight:700;color:var(--ink);\">El Estado les delegó esta misión<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.45;\">La Fundación gestiona el REDMO por mandato oficial del Ministerio de Sanidad. Ese mandato no significa que el Estado lo financie: en el convenio ONT-FJC de 2023, la Administración aportó 100.000 € y la Fundación puso otros 100.000 €.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--orange-deep);flex-shrink:0;\">5<\u002Fdiv>\n      <div><div style=\"font-size:27px;font-weight:700;color:var(--ink);\">No está sola: red internacional de fundaciones hermanas<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.45;\">En Alemania, la fundación equivalente ha recaudado más de 250 M€ en 31 galas de TV, financiando 1.552 proyectos. La Fundación Josep Carreras es el nodo español de ese esfuerzo compartido.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cómo contarlo: el guion\" data-screen-label=\"26\" data-speaker-notes=\"El gancho inicial pide permiso y promete brevedad: minuto y medio.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 10% -14%,rgba(255,105,0,.1),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;\">Argumentario · El guion<\u002Fdiv>\n  <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:52px;color:var(--dark-text);line-height:1.3;max-width:1550px;\">“¿Te importa si te cuento algo de minuto y medio? Es la historia de Marta, una paciente, es ficticia, pero su proceso es exactamente el real.”<\u002Fp>\n  <p style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;margin-top:44px;max-width:1300px;\">Así empieza el discurso de captación: pide permiso, promete brevedad y anuncia una historia, no una lista de cifras.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"El relato, paso a paso\" data-screen-label=\"27\" data-speaker-notes=\"El discurso recorre el proceso de Marta, tocando cada frente de la FJC a través de una sola persona.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario · El guion<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">El relato, paso a paso<\u002Fh2>\n  <p style=\"font-size:26px;color:var(--gray);font-weight:500;margin-bottom:28px;max-width:1600px;\">A Marta le diagnostican leucemia. Le hacen pruebas a su familia, pero solo 1 de cada 4 pacientes tiene un familiar compatible, y Marta no es uno de esos casos.<\u002Fp>\n  <div style=\"display:flex;flex:1;gap:0;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--orange);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">El diagnóstico<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">El REDMO<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Tendrá que depender de un desconocido: la probabilidad de compatibilidad no emparentada es de 1 entre 3.500. El REDMO busca en una base de 520.508 donantes, conectada con más de 30 países.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--orange);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">La espera<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">26 días<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">A los 26 días, la mediana de espera, encuentran a alguien compatible. El 84% de los pacientes, como Marta, tiene esa suerte.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--orange);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">El desplazamiento<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Pisos de Acogida<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">El hospital está lejos de casa. Su madre la acompaña gratis en uno de los 9 pisos de acogida: nadie debe elegir entre estar cerca o pagar el alquiler.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--orange);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">El acompañamiento<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Experiencia del Paciente<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">Consultas médicas e informativas (más de 22.000 de cada tipo desde 2010) le ayudan a entender cada paso del proceso.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--orange);\"><\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--orange-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">El tratamiento<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--ink);font-weight:700;margin-top:8px;line-height:1.35;\">Instituto Josep Carreras<\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.45;\">El trasplante sale bien, con una terapia que no existía hace pocos años: salió del Instituto, el centro más grande de Europa dedicado a esta enfermedad.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Un mismo caso, cada frente de la Fundación: el relato conecta cifra y vida real.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"El cierre y la llamada a la acción\" data-screen-label=\"28\" data-speaker-notes=\"El cierre invita a formar parte, con una cuota concreta y accesible.\" style=\"display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(1300px 850px at 10% -14%,rgba(255,105,0,.1),transparent 58%),var(--dark-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;color:var(--dark-text);text-align:center;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-vivid);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;\">Argumentario · El cierre<\u002Fdiv>\n  <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:42px;color:var(--dark-text);line-height:1.4;max-width:1600px;\">“La historia de Marta (el registro, el trasplante, el piso de acogida, la investigación que hizo posible su tratamiento) es un solo sistema, y lo sostienen más de 155.000 socios.”<\u002Fp>\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-top:56px;\">\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:100px;color:var(--orange-vivid);\">~12 €<\u002Fdiv>\n    <div style=\"font-size:var(--type-subtitle);color:var(--dark-muted);font-weight:500;\">al mes (140-150 €/año)<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:32px;color:var(--dark-text);font-weight:600;margin-top:40px;\">¿Te animas?<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Lo esencial en una diapositiva\" data-screen-label=\"29\" data-speaker-notes=\"Ficha resumen para repasar antes de una conversación de captación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Cierre<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Lo esencial en una diapositiva<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px 20px;flex:1;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--orange-deep);\"> ius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--orange-deep);\">9+5<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Pisos y hoteles de acogida gratuitos<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--orange-deep);\">400+<\u002Fdiv><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Profesionales del Instituto Josep Carreras<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Vídeos de apoyo\" data-screen-label=\"30\" data-speaker-notes=\"Material audiovisual útil para preparar visitas y conversaciones de captación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(204,84,0,.05),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Cierre<\u002Fdiv>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">Vídeos de apoyo<\u002Fh2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1400px;\">Testimonios y campañas para reforzar la formación y preparar conversaciones<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;flex:1;justify-content:center;\">\n    <a href=\"https://www.youtube.com/watch?v=wlnXuOC9zJc\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:14px 0;border-bottom:1px solid var(--border)
