s de sangre</div></div>\n    </div>\n  </div>\n  <div class=\"fade-3\" style=\"position:relative;flex:0 0 600px;border-radius:28px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow-card);\">\n    <img src=\"a9df8105-3721-43cb-9200-54ce87034ea1\" alt=\"Portada\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n  </div>\n</section>\n\n<section data-label=\"Índice\" data-screen-label=\"02\" data-speaker-notes=\"Recorrido de la sesión: de dónde venimos, qué investiga y hace el BBRC, y cómo lo contamos. Duración prevista: 120 minutos.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Hoy vamos a ver</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Índice de la sesión</h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px 64px;flex:1;align-content:center;\">\n    <div style=\"display:flex;flex-direction:column;gap:26px;\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde);width:56px;\">01</span><span style=\"font-size:28px;font-weight:600;color:var(--ink);\">Quiénes somos</span></div>\n      <div style=\"display:flex;align-items:baseline;gap:20px;\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde);width:56px;\">02</span><span style=\"font-size:28px;font-weight:600;color:var(--ink);\">Investigación — BBRC</span></div>\n      <div style=\"display:flex;align-items:baseline;gap:20px;\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde);width:56px;\">03</span><span style=\"font-size:28px;font-weight:600;color:var(--ink);\">Prevención y apoyo a familias</span></div>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:26px;\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde);width:56px;\">04</span><span style=\"font-size:28px;font-weight:600;color:var(--ink);\">Divulgación e incidencia</span></div>\n      <div style=\"display:flex;align-items:baseline;gap:20px;\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde);width:56px;\">05</span><span style=\"font-size:28px;font-weight:600;color:var(--ink);\">Comunidad y transparencia económica</span></div>\n      <div style=\"display:flex;align-items:baseline;gap:20px;\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde);width:56px;\">06</span><span style=\"font-size:28px;font-weight:600;color:var(--ink);\">Argumentario de captación</span></div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:28px;display:flex;justify-content:space-between;\">\n    <span style=\"font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Datos verificados septiembre 2026</span>\n    <span style=\"font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">fpmaragall.org</span>\n  </div>\n</section>\n\n<section data-label=\"Divisor · Quiénes somos\" data-screen-label=\"03\" data-speaker-notes=\"Arrancamos por el origen de la Fundación y la magnitud del Alzheimer, el reto que justifica su trabajo.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(122,178,59,.12),transparent 58%),var(--beige);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--beige-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">01</span>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 01</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--ink);letter-spacing:-.02em;max-width:1300px;\">Quiénes somos</h2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:28px;max-width:1150px;\">Origen, misión y el reto del Alzheimer que la Fundación trabaja para cerrar.</p>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:26px;height:7px;border-radius:4px;background:var(--verde);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span></div>\n  </div>\n</section>\n\n<section data-label=\"Quiénes somos\" data-screen-label=\"04\" data-speaker-notes=\"Única fundación en España dedicada casi en exclusiva a la investigación preventiva del Alzheimer, a través del BBRC.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Fundación Pasqual Maragall</h2>\n  <div style=\"display:flex;gap:64px;flex:1;align-items:center;\">\n    <p style=\"flex:1.1;font-size:var(--type-body);color:var(--ink);line-height:1.55;font-weight:400;\">Fundada en abril de 2008 por Pasqual Maragall (alcalde de Barcelona 1982-1997, presidente de la Generalitat 2003-2006), medio año después de hacer público su propio diagnóstico de Alzheimer. Es la única fundación en España dedicada casi en exclusiva a la investigación preventiva de esta enfermedad, a través del Barcelonaβeta Brain Research Center (BBRC). Hoy, con 85 años, Pasqual Maragall mantiene la presidencia de honor; la preside su hija, Cristina Maragall, y la dirige el Dr. Arcadi Navarro.</p>\n    <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:center;\">\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);\">2008</div><div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Fundada por Pasqual Maragall</div></div>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);\">112.842</div><div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Socios y socias a cierre de 2025</div></div>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);\">93 M€</div><div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Invertidos en investigación 2013-2025</div></div>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);\">80</div><div style=\"font-size:var(--type-small);color:var(--gray);font-weight:600;margin-top:8px;\">Artículos científicos publicados en 2025</div></div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: Fundación Pasqual Maragall · Informe de Impacto 2025</div>\n</section>\n\n<section data-label=\"Nuestro origen\" data-screen-label=\"05\" data-speaker-notes=\"El origen humaniza a la organización: Pasqual Maragall convirtió su propio diagnóstico en la Fundación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Nuestro origen</h2>\n  <div style=\"display:flex;gap:80px;flex:1;align-items:center;\">\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:96px;color:var(--verde);line-height:1;\">2007 → 2008</div>\n      <p style=\"font-size:var(--type-body);color:var(--ink);line-height:1.55;margin-top:28px;max-width:640px;\">El 20 de octubre de 2007, <b>Pasqual Maragall</b> hizo público su diagnóstico de Alzheimer: “Quiero ayudar a derrotar esta enfermedad. En ningún lugar está escrito que sea invencible.” Medio año después, en abril de 2008, fundó la entidad que lleva su nombre.</p>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Presidencia actual</div>\n        <p style=\"font-size:26px;color:var(--ink);font-weight:600;margin-top:10px;line-height:1.4;\">Con 85 años, Pasqual Maragall mantiene la presidencia de honor. La preside su hija, Cristina Maragall, y la dirige el Dr. Arcadi Navarro (director general).</p>\n      </div>\n      <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n        <div style=\"font-size:var(--type-small);color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Un crecimiento sostenido</div>\n        <p style=\"font-size:26px;color:var(--ink);font-weight:600;margin-top:10px;line-height:1.4;\">De 147 socios en 2012 a 112.842 en 2025. La colaboración con Wesser ha contribuido, captando +29.000 nuevos socios.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section data-label=\"El problema — la ventana de 20 años\" data-screen-label=\"06\" data-speaker-notes=\"Contextualizar el problema antes de hablar de soluciones: la fase preclínica silenciosa y la magnitud del Alzheimer.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 10% -14%,rgba(122,178,59,.12),transparent 58%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">El problema — el Alzheimer empieza 20 años antes</h2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1550px;\">El daño se acumula en silencio mientras la persona se siente perfectamente bien: esa es la ventana real para intervenir, no cuando ya hay diagnóstico.</p>\n  <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n    <div style=\"flex:0.9;background:var(--verde);border-radius:24px;box-shadow:var(--shadow-card-verde);padding:44px;color:#fff;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:130px;line-height:1;\">1 de 2</div>\n      <p style=\"font-size:26px;font-weight:500;margin-top:16px;line-height:1.5;\">personas verá su vida afectada por la demencia si nada cambia: bien porque la desarrolle, bien porque cuide a alguien que la tiene.</p>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"display:flex;align-items:baseline;gap:22px;background:var(--paper-2);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow-card);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">900.000</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">personas con Alzheimer u otra demencia en España</div></div>\n      <div style=\"display:flex;align-items:baseline;gap:22px;background:var(--paper-2);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow-card);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">416 M</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">personas en el \"continuo\" del Alzheimer en el mundo (Gustavsson et al. 2022)</div></div>\n      <div style=\"display:flex;align-items:baseline;gap:22px;background:var(--paper-2);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow-card);\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">6%</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">de los pacientes son hoy elegibles para los nuevos fármacos modificadores</div></div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">2 de cada 3 españoles tienen o han tenido en su entorno a alguien con Alzheimer. Fuente: Sociedad Española de Neurología / Fundación Pasqual Maragall · Estudio percepción social 2025</div>\n</section>\n\n<section data-label=\"Destino de los fondos\" data-screen-label=\"07\" data-speaker-notes=\"Desglose oficial del Informe de Impacto 2025: más de la mitad va directa a investigación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Quiénes somos</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:8px;\">Destino de los fondos</h2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1500px;\">30.735.836 € de presupuesto conjunto (Fundación + BBRC) en 2025. Así se destinaron:</p>\n  <div style=\"display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center;\">\n    <div style=\"display:flex;\">\n      <div style=\"width:57%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:var(--verde);\">57%</div>\n      <div style=\"width:22%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:#3ba896;\">22%</div>\n      <div style=\"width:16%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;color:#8ec4ba;\">16%</div>\n      <div style=\"width:4%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:22px;color:#b7bab5;\">4%</div>\n      <div style=\"width:1%;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;color:#d8d5cd;\">1%</div>\n    </div>\n    <div style=\"display:flex;border-radius:16px;overflow:hidden;height:64px;box-shadow:var(--shadow-card);\">\n      <div style=\"width:57%;background:var(--verde);\"></div>\n      <div style=\"width:22%;background:#3ba896;\"></div>\n      <div style=\"width:16%;background:#8ec4ba;\"></div>\n      <div style=\"width:4%;background:#b7bab5;\"></div>\n      <div style=\"width:1%;background:#d8d5cd;\"></div>\n    </div>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:20px;\">\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--verde);margin-right:8px;\"></span><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Programas de investigación (BBRC y becas)</span></div>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#3ba896;margin-right:8px;\"></span><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Red de socios y campañas</span></div>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#8ec4ba;margin-right:8px;\"></span><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Apoyo familias, sensibilización e incidencia</span></div>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#b7bab5;margin-right:8px;\"></span><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Administración</span></div>\n      <div><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#d8d5cd;margin-right:8px;\"></span><span style=\"font-size:var(--type-small);color:var(--ink);font-weight:600;\">Otras partidas menores</span></div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Por cada euro destinado a conseguir nuevos socios, se obtiene un retorno de 3 euros. Fuente: FPM · Informe de Impacto 2025</div>\n</section>\n\n<section data-label=\"Divisor · Investigación — BBRC\" data-screen-label=\"08\" data-speaker-notes=\"Segunda sección: el Barcelonaβeta Brain Research Center, la cohorte Alfa y los avances de 2025-2026.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(122,178,59,.12),transparent 58%),var(--beige);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--beige-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">02</span>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 02</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--ink);letter-spacing:-.02em;max-width:1300px;\">Investigación — BBRC</h2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:28px;max-width:1200px;\">La cohorte Alfa, los nuevos biomarcadores y los primeros fármacos que cambian el diagnóstico.</p>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:26px;height:7px;border-radius:4px;background:var(--verde);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span></div>\n  </div>\n</section>\n\n<section data-label=\"BBRC — 9 grupos de investigación\" data-screen-label=\"09\" data-speaker-notes=\"El BBRC cuenta con 9 grupos de investigación y participa en 6 consorcios internacionales; en julio de 2026 debuta en el AAIC de Londres.\" style=\"display:flex;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"flex:1.1;display:flex;flex-direction:column;padding-right:56px;min-width:0;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación — BBRC</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:20px;\">El Barcelonaβeta Brain Research Center</h2>\n    <p style=\"font-size:26px;color:var(--ink);line-height:1.5;font-weight:400;margin-bottom:32px;\">El BBRC cuenta a mediados de 2026 con 9 grupos de investigación (los últimos, en IA y Datos de Salud, y en Epidemiología Molecular, incorporados en 2026) y participa en 6 consorcios internacionales. Su sede, Wellington 30 (Campus Ciutadella UPF, 4.276 m², arquitecto Juan Navarro Baldeweg), se inauguró en 2016.</p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">9</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:6px;\">grupos de investigación</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">6</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:6px;\">consorcios internacionales (AD-RIDDLE, MenoBrain...)</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">80</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:6px;\">publicaciones en 2025 (84% en Q1)</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">46</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:6px;\">conferencias internacionales en 2025</div></div>\n    </div>\n    <div style=\"border-top:1px solid var(--border);padding-top:20px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Julio de 2026: primera participación conjunta con el BBRC en el AAIC de Londres, el mayor congreso mundial sobre Alzheimer. Fuente: BBRC · Grupos de investigación</div>\n  </div>\n  <div style=\"flex:0 0 600px;border-radius:28px;overflow:hidden;background:var(--paper-2);box-shadow:var(--shadow-card);\">\n    <img src=\"f23731d8-eaba-480b-867f-9f81ce9666d7\" alt=\"BBRC\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n  </div>\n</section>\n\n<section data-label=\"Estudio Alfa\" data-screen-label=\"10\" data-speaker-notes=\"2.743 participantes seguidos desde 2013; la infraestructura que alimenta a todos los demás estudios del BBRC.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación — BBRC</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">Estudio Alfa — la cohorte de referencia</h2>\n  <p style=\"font-size:26px;color:var(--gray);font-weight:500;margin-bottom:28px;max-width:1600px;\">La plataforma central del BBRC para caracterizar los 20 años de fase preclínica del Alzheimer. 2.743 participantes de 45-75 años, seguidos desde 2013. Así fue cada visita en 2025:</p>\n  <div style=\"display:flex;flex:1;gap:0;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Muestras de sangre</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);margin-top:10px;\">23.947</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">muestras procesadas en 2025</div>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Neuroimagen</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);margin-top:10px;\">965</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">resonancias magnéticas en 2025</div>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Cognición y enfermería</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);margin-top:10px;\">3.563</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">sesiones totales (1.292 clínicas, 1.219 de cognición, 1.052 de enfermería)</div>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">El resultado</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;color:var(--ink);margin-top:10px;\">4</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">ensayos clínicos activos que se apoyan en esta cohorte</div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">\"Aportar algo, por muy poco que sea, siempre es conveniente. Este es un pasito que se va agregando para un futuro sin Alzheimer\" — Julián, voluntario de 67 años. Fuente: FPM · Informe de Impacto 2025 / Blog testimonios de voluntarios</div>\n</section>\n\n<section data-label=\"Diagnóstico por análisis de sangre\" data-screen-label=\"11\" data-speaker-notes=\"El hallazgo más relevante de 2025: un biomarcador en sangre detecta el Alzheimer con más del 90% de precisión.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación — BBRC</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Un análisis de sangre para detectar el Alzheimer</h2>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:stretch;\">\n    <div style=\"flex:0.8;display:flex;flex-direction:column;justify-content:center;background:var(--verde);border-radius:20px;box-shadow:var(--shadow-card-verde);padding:36px;color:#fff;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:80px;\">&gt;90%</div>\n      <p style=\"font-size:26px;font-weight:500;margin-top:16px;line-height:1.5;\">de precisión del biomarcador p-tau217 en sangre, publicado en Nature Medicine. Comparable a la punción lumbar, pero sin sedación.</p>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-size:var(--type-small);color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;\">Un segundo biomarcador</div>\n      <p style=\"font-size:26px;color:var(--ink);font-weight:500;line-height:1.5;\">El <b>p-tau231</b> (Dr. Marc Suárez-Calvet) detecta cambios cerebrales aún más incipientes, antes de que llegue a formarse placa. El sistema <b>Lumipulse p-tau217</b>, ya validado, permite llevar este análisis a la práctica clínica real.</p>\n      <p style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:20px;\">El BBRC también participa en SCAP-AD (métodos ultrasensibles) y SpeechDx (biomarcadores del habla, 2.650 participantes).</p>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: BBRC / Nature Medicine</div>\n</section>\n\n<section data-label=\"ALFA10\" data-screen-label=\"12\" data-speaker-notes=\"El proyecto más ambicioso de la década: un algoritmo que anticipe el riesgo de Alzheimer antes de los primeros síntomas.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación — BBRC</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">ALFA10 — el algoritmo que se anticipará al Alzheimer</h2>\n  <p style=\"font-size:24px;color:var(--gray);font-weight:500;margin-bottom:0;\">Una misma cohorte, tres momentos:</p>\n  <div style=\"display:flex;flex-direction:column;flex:1;justify-content:center;gap:28px;\">\n  <div style=\"display:flex;align-items:center;gap:20px;\">\n    <div style=\"flex:1;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;text-align:center;\">\n      <div style=\"font-size:22px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">2013</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:38px;color:var(--verde-deep);margin-top:8px;\">ALFA</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;\">2.743 personas, cohorte original</div>\n    </div>\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde);flex-shrink:0;\">→</div>\n    <div style=\"flex:1;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:30px;text-align:center;\">\n      <div style=\"font-size:22px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">2016</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:38px;color:var(--verde-deep);margin-top:8px;\">ALFA+</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;\">450 personas, sin alteraciones cognitivas</div>\n    </div>\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde);flex-shrink:0;\">→</div>\n    <div style=\"flex:1;background:var(--verde);border-radius:20px;box-shadow:var(--shadow-card-verde);padding:30px;text-align:center;color:#fff;\">\n      <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.85;\">2026-27</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:38px;margin-top:8px;\">ALFA10</div>\n      <div style=\"font-size:22px;font-weight:500;margin-top:10px;opacity:.92;\">+2.000 personas recontactadas, algoritmo predictivo</div>\n    </div>\n  </div>\n  <div style=\"display:flex;gap:24px;\">\n    <div style=\"flex:1;display:flex;align-items:baseline;gap:16px;background:var(--paper-2);border-radius:16px;padding:18px 24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">31 M€</div><div style=\"font-size:21px;color:var(--gray);font-weight:600;\">consorcio europeo AD-RIDDLE (2024-2028, 6 países + EE.UU.)</div></div>\n    <div style=\"flex:1;display:flex;align-items:baseline;gap:16px;background:var(--paper-2);border-radius:16px;padding:18px 24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">Digital</div><div style=\"font-size:21px;color:var(--gray);font-weight:600;\">apps de cognición, pulsación de teclas y habla, sin desplazarse</div></div>\n  </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">\"El objetivo es entender mejor cómo progresa la enfermedad antes de que se manifiesten los síntomas, y preparar un protocolo que, a la larga, pueda ser adoptado por el sistema de salud\" — Dr. Gonzalo Sánchez, investigador del BBRC. Fuente: BBRC · Estudio Alfa / ALFA10 / AD-RIDDLE</div>\n</section>\n\n<section data-label=\"4 ensayos clínicos activos\" data-screen-label=\"13\" data-speaker-notes=\"2025 es un año bisagra: por primera vez llegan fármacos que modifican el curso de la enfermedad, y el BBRC participa en los 4 ensayos clave.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación — BBRC</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">4 ensayos clínicos — los primeros fármacos modificadores</h2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--ink);\">AHEAD A3-45</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:10px;line-height:1.35;\">Lecanemab · 1.400 participantes · prevención en alto riesgo</div></div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--ink);\">LAKI</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:10px;line-height:1.35;\">Remternetug · ~1.200 participantes · España y RU, únicos 2 países europeos</div></div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--ink);\">ReTain</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:10px;line-height:1.35;\">Inmunoterapia activa anti-tau, en Alzheimer preclínico</div></div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--ink);\">AACO</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:10px;line-height:1.35;\">Donanemab · fase III · TRAILBLAZER-ALZ 5</div></div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Solo alrededor del 6% de los pacientes son hoy elegibles para estos fármacos (criterios EMA), de ahí la urgencia de la detección precoz. Fuente: BBRC · Notas de prensa 2025-2026</div>\n</section>\n\n<section data-label=\"Minicerebros\" data-screen-label=\"14\" data-speaker-notes=\"Organoides cerebrales cultivados a partir de una simple muestra de sangre, sin experimentación animal.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Investigación — BBRC</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">Minicerebros — investigar sin experimentación animal</h2>\n  <div style=\"display:flex;flex-direction:column;flex:1;justify-content:center;gap:28px;\">\n    <div style=\"background:var(--paper-2);border-radius:24px;padding:40px 48px;box-shadow:var(--shadow-card);\">\n      <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:34px;color:var(--ink);line-height:1.4;\">\"Los organoides cerebrales suponen un salto importante para avanzar en la comprensión de la progresión del Alzheimer.\"</p>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;margin-top:16px;\">Dra. Sandra Acosta, investigadora del BBRC</div>\n    </div>\n    <div style=\"display:flex;gap:20px;\">\n      <div style=\"flex:1;display:flex;align-items:baseline;gap:14px;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">2022</div><div style=\"font-size:19px;color:var(--gray);font-weight:600;\">inicio de la línea, Dra. Laura García González</div></div>\n      <div style=\"flex:1;display:flex;align-items:baseline;gap:14px;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">3-4 mm³</div><div style=\"font-size:19px;color:var(--gray);font-weight:600;\">tamaño máximo de los organoides</div></div>\n      <div style=\"flex:1;display:flex;align-items:baseline;gap:14px;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">2025</div><div style=\"font-size:19px;color:var(--gray);font-weight:600;\">nuevo grupo, Dra. Sandra Acosta</div></div>\n      <div style=\"flex:1;display:flex;align-items:baseline;gap:14px;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">250.000€</div><div style=\"font-size:19px;color:var(--gray);font-weight:600;\">campaña \"Minicerebros\", recaudada con éxito</div></div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Cultivos celulares tridimensionales (organoides cerebrales) que reproducen la estructura del cerebro humano, a partir de una simple muestra de sangre. Fuente: FPM / Barcelona Ciència</div>\n</section>\n\n<section data-label=\"Divisor · Prevención y apoyo a familias\" data-screen-label=\"15\" data-speaker-notes=\"Tercera sección: hábitos que cambian el cerebro, y acompañamiento a quienes cuidan y a quienes reciben el diagnóstico.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(122,178,59,.12),transparent 58%),var(--beige);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--beige-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">03</span>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 03</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--ink);letter-spacing:-.02em;max-width:1300px;\">Prevención y apoyo a familias</h2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:28px;max-width:1200px;\">Hábitos que cambian el cerebro, y acompañamiento a quienes cuidan y a quienes reciben el diagnóstico.</p>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:26px;height:7px;border-radius:4px;background:var(--verde);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span></div>\n  </div>\n</section>\n\n<section data-label=\"Prevención — ALFASleep y PENSA\" data-screen-label=\"16\" data-speaker-notes=\"Hasta un 45% de las demencias mundiales podrían prevenirse o retrasarse actuando sobre hábitos de vida.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Prevención y apoyo a familias</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">Prevención — ALFASleep y PENSA</h2>\n  <p style=\"font-size:26px;color:var(--verde-deep);font-weight:700;margin-bottom:var(--gap-title);max-width:1550px;\">45% de las demencias mundiales son potencialmente prevenibles actuando sobre 14 factores de riesgo (Lancet Commission, 2024).</p>\n  <div style=\"display:flex;gap:32px;flex:1;align-items:stretch;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:40px;border-top:6px solid var(--verde);\">\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.06em;\">ALFASleep</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:64px;color:var(--ink);margin-top:14px;\">171</div>\n      <p style=\"font-size:24px;color:var(--gray);font-weight:500;margin-top:12px;line-height:1.5;\">participantes de ALFA+ (450 sin alteraciones cognitivas): el sueño fragmentado daña regiones cerebrales vulnerables al Alzheimer, con un efecto más pronunciado en mujeres.</p>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--verde);color:#fff;border-radius:20px;box-shadow:var(--shadow-card-verde);padding:40px;\">\n      <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85;\">PENSA</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:64px;margin-top:14px;\">×4,5</div>\n      <p style=\"font-size:24px;font-weight:500;margin-top:12px;line-height:1.5;opacity:.94;\">mejora en cognición combinando hábitos saludables con un compuesto del té verde, y una reducción del 25% en el riesgo de demencia.</p>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: FPM · Estudio ALFASleep / Estudio PENSA / Lancet Commission 2024</div>\n</section>\n\n<section data-label=\"Acompañamiento a personas cuidadoras\" data-screen-label=\"17\" data-speaker-notes=\"El bienestar de quien cuida repercute directamente en la calidad de los cuidados que recibe la persona enferma.\" style=\"display:flex;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"flex:1.1;display:flex;flex-direction:column;padding-right:56px;min-width:0;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Prevención y apoyo a familias</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:20px;\">Acompañamiento a personas cuidadoras</h2>\n    <p style=\"font-size:26px;color:var(--ink);line-height:1.5;font-weight:400;margin-bottom:28px;\">El 80% de las personas con Alzheimer son cuidadas por su propia familia, con una dedicación media de 70 horas semanales; 1 de cada 3 personas cuidadoras está deprimida. Los Grupos Terapéuticos gratuitos (Barcelona y Madrid) y el programa online acompañan ese esfuerzo.</p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">184 grupos</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:6px;\">1.723 personas acompañadas desde 2013</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">120 grupos</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:6px;\">1.090 personas, programa online desde 2021</div></div>\n    </div>\n    <div style=\"border-top:1px solid var(--border);padding-top:20px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">\"Los cuidadores carecen de apoyo y reconocimiento, enfrentándose al riesgo de aislamiento y exclusión social\" — Cristina Maragall, presidenta de la Fundación. Fuente: Informe \"Cuidando en Alzheimer\" (2025)</div>\n  </div>\n  <div style=\"flex:0 0 600px;border-radius:28px;overflow:hidden;background:var(--paper-2);box-shadow:var(--shadow-card);\">\n    <img src=\"b5687208-e089-4b1c-a40b-c3b6e78df876\" alt=\"Acompañamiento a familias\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n  </div>\n</section>\n\n<section data-label=\"Plenamente Activas\" data-screen-label=\"18\" data-speaker-notes=\"Acompañar a quien recibe el diagnóstico: pasar del estigma a la escucha, del aislamiento a la inclusión.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Prevención y apoyo a familias</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;max-width:1500px;\">Plenamente Activas — acompañar a quien recibe el diagnóstico</h2>\n  <p style=\"font-size:24px;color:var(--gray);font-weight:500;margin-bottom:28px;max-width:1550px;\">Intervención psicológica grupal, gratuita y presencial (grupos de 6, 8 sesiones semanales de 1h, en Barcelona), para personas en fases iniciales de la enfermedad y con conciencia de su diagnóstico.</p>\n  <div style=\"display:flex;gap:32px;flex:1;align-items:center;\">\n    <div style=\"flex:1;text-align:center;background:var(--paper-2);border-radius:24px;padding:40px;box-shadow:var(--shadow-card);\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:110px;color:var(--verde-deep);line-height:1;\">96%</div>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:14px;\">asistencia en el proyecto piloto (25 participantes, abril 2026)</div>\n    </div>\n    <div style=\"flex:1;text-align:center;background:var(--verde);color:#fff;border-radius:24px;padding:40px;box-shadow:var(--shadow-card-verde);\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:110px;line-height:1;\">88%</div>\n      <div style=\"font-size:24px;font-weight:600;margin-top:14px;opacity:.92;\">valoró la experiencia positivamente</div>\n    </div>\n  </div>\n  <div style=\"display:flex;justify-content:center;margin-top:24px;\"><div style=\"font-size:22px;color:var(--gray-soft);font-weight:600;\">1.867 usuarios registrados en la plataforma AreaAlzheimer</div></div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">\"Pasar del estigma a la escucha, del aislamiento a la inclusión\" — Laia Ortiz, directora del Área Social. Piloto financiado por Fundación \"la Caixa\". Fuente: Entre Mayores / FPM</div>\n</section>\n\n<section data-label=\"Testimonios reales\" data-screen-label=\"19\" data-speaker-notes=\"Voces reales de voluntarios y cuidadoras: úsalas para conectar los datos con personas concretas.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Prevención y apoyo a familias</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Testimonios reales</h2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n      <p style=\"font-size:26px;color:var(--ink);font-weight:600;line-height:1.5;\">\"Puede ser una vacuna, un medicamento... algo que frene la enfermedad. Aunque no sea para nosotros, puede ser de gran ayuda para nuestros hijos, nuestros nietos y... para todo el mundo.\"</p>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:16px;\">Celia, 70 años, voluntaria del Estudio Alfa</div>\n    </div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n      <p style=\"font-size:26px;color:var(--ink);font-weight:600;line-height:1.5;\">\"Lo que aprendes en los grupos terapéuticos no está en los libros.\"</p>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:16px;\">Gladys Hernández, médica anestesista y cuidadora de su padre</div>\n    </div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:32px;\">\n      <p style=\"font-size:26px;color:var(--ink);font-weight:600;line-height:1.5;\">\"Aportar algo, por muy poco que sea, siempre es conveniente. Este es un pasito que se va agregando para un futuro sin Alzheimer.\"</p>\n      <div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:16px;\">Julián, 67 años, voluntario del Estudio Alfa</div>\n    </div>\n    <div style=\"background:var(--verde);border-radius:20px;box-shadow:var(--shadow-card-verde);padding:32px;color:#fff;\">\n      <p style=\"font-size:26px;font-weight:600;line-height:1.5;\">\"Pasar del estigma a la escucha, del aislamiento a la inclusión.\"</p>\n      <div style=\"font-size:24px;opacity:.85;font-weight:600;margin-top:16px;\">Laia Ortiz, directora del Área Social de la Fundación</div>\n    </div>\n  </div>\n</section>\n\n<section data-label=\"Divisor · Divulgación e incidencia\" data-screen-label=\"20\" data-speaker-notes=\"Cuarta sección: cómo la Fundación pone el Alzheimer en la agenda pública y política.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(122,178,59,.12),transparent 58%),var(--beige);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--beige-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">04</span>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 04</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--ink);letter-spacing:-.02em;max-width:1300px;\">Divulgación e incidencia</h2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:28px;max-width:1200px;\">Cómo la Fundación pone el Alzheimer en la agenda pública y política.</p>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:26px;height:7px;border-radius:4px;background:var(--verde);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span></div>\n  </div>\n</section>\n\n<section data-label=\"Divulgación — Brain Film Fest y blog\" data-screen-label=\"21\" data-speaker-notes=\"Uno de los programas de divulgación sobre Alzheimer más activos de España.\" style=\"display:flex;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"flex:1.1;display:flex;flex-direction:column;padding-right:56px;min-width:0;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Divulgación e incidencia</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:20px;\">Divulgación — Brain Film Fest y 1,4 M de visitas al blog</h2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">76</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:8px;\">charlas divulgativas en 2025</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">1,4 M</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:8px;\">visitas al blog \"Hablemos sobre el Alzheimer\"</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">6.389</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:8px;\">espectadores en el Brain Film Fest 2025 (Informe de Impacto)</div></div>\n      <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:22px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:34px;color:var(--verde-deep);\">137.599</div><div style=\"font-size:22px;color:var(--gray);font-weight:600;margin-top:8px;\">seguidores en redes, 909.208 interacciones</div></div>\n    </div>\n    <div style=\"border-top:1px solid var(--border);padding-top:20px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Brain Film Fest 2025 (8ª ed., CCCB Barcelona): 44 actividades, Premio Especial a Nicolas Philibert. La 9ª edición 2026 (\"Habitar la mente\") se inauguró con \"Romería\" de Carla Simón; una nota de prensa de la FPM estimó la asistencia en 5.500, cifra que no cuadra con los 6.389 de la edición anterior. 3.015 impactos en medios, 757 M de audiencia. Fuente: FPM · Memoria de comunicación</div>\n  </div>\n  <div style=\"flex:0 0 600px;border-radius:28px;overflow:hidden;background:var(--paper-2);box-shadow:var(--shadow-card);\">\n    <img src=\"8f35fb6e-d782-4006-8f7b-3f989777d531\" alt=\"Divulgación\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n  </div>\n</section>\n\n<section data-label=\"Acción institucional — incidencia política\" data-screen-label=\"22\" data-speaker-notes=\"Situar el Alzheimer en la agenda política: Parlamento de Cataluña, Observatorio y manifiesto al Congreso.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Divulgación e incidencia</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Acción institucional — incidencia política</h2>\n  <div style=\"display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center;\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 32px;\">\n      <div style=\"font-size:24px;color:var(--ink);font-weight:600;line-height:1.4;\">El Observatorio del Alzheimer y las Demencias (con Novo Nordisk) confirma que la enfermedad es la <b>2ª mayor preocupación de salud</b> de los españoles, tras el cáncer, y la <b>1ª entre las personas mayores</b>.</div>\n    </div>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 32px;\">\n      <div style=\"font-size:24px;color:var(--ink);font-weight:600;line-height:1.4;\">En 2025 entregó al Congreso de los Diputados un manifiesto respaldado por <b>más de 500.000 firmas</b> para que el Alzheimer sea prioridad estratégica en investigación, sanidad y apoyo social.</div>\n    </div>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px 32px;\">\n      <div style=\"font-size:24px;color:var(--ink);font-weight:600;line-height:1.4;\">Forma parte de la coalición <b>#CompromisoAlzheimer</b> y del <b>Manifiesto de Helsinki</b> (9,1 millones de afectados en la UE), y ha trasladado al Parlamento de Cataluña la necesidad de tratar el Alzheimer como prioridad de salud pública.</div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: FPM · Acción institucional / Observatorio del Alzheimer, estudio de percepción social 2025</div>\n</section>\n\n<section data-label=\"Reconocimiento institucional\" data-screen-label=\"23\" data-speaker-notes=\"Visitas de primer nivel y programas de becas que sitúan a la Fundación en el mapa institucional.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Divulgación e incidencia</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Reconocimiento institucional</h2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;align-items:start;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-size:24px;color:var(--ink);font-weight:700;line-height:1.35;\">Visitas de primer nivel</div><div style=\"font-size:22px;color:var(--gray);margin-top:10px;line-height:1.4;\">Pedro Sánchez, S.M. la Reina Doña Sofía, la ministra Diana Morant, y Lenny Shallcross (World Dementia Council)</div></div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">400.000€</div><div style=\"font-size:22px;color:var(--gray);margin-top:8px;\">por proyecto, FPM–ALZ AD/ADRD Fellows Program (con Alzheimer's Association EE.UU.)</div></div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">148.000€</div><div style=\"font-size:22px;color:var(--gray);margin-top:8px;\">3 becas predoctorales del HUB Alzheimer Barcelona (mayo 2026)</div></div>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:26px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;color:var(--verde-deep);\">+500</div><div style=\"font-size:22px;color:var(--gray);margin-top:8px;\">asistentes al Primer Encuentro Anual en Madrid (junio 2026)</div></div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: FPM · Acción institucional / Noticias 2026</div>\n</section>\n\n<section data-label=\"Divisor · Comunidad y transparencia económica\" data-screen-label=\"24\" data-speaker-notes=\"Quinta sección: 112.842 socios, 30,7 M€ de presupuesto y cuentas claras.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(122,178,59,.12),transparent 58%),var(--beige);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--beige-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">05</span>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 05</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--ink);letter-spacing:-.02em;max-width:1300px;\">Comunidad y transparencia económica</h2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:28px;max-width:1200px;\">112.842 socios, becas de investigación, y cuentas claras sobre de dónde viene y adónde va el dinero.</p>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:26px;height:7px;border-radius:4px;background:var(--verde);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span></div>\n  </div>\n</section>\n\n<section data-label=\"Actividad económica\" data-screen-label=\"25\" data-speaker-notes=\"30,7 M€ de presupuesto conjunto; el origen de los ingresos y la plantilla de la Fundación y el BBRC.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Comunidad y transparencia económica</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:8px;max-width:1500px;\">Actividad económica — 30,7 M€, origen de los ingresos</h2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1500px;\">Presupuesto conjunto Fundación + BBRC en 2025: 30.735.836 €.</p>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:stretch;\">\n    <div style=\"flex:1.1;display:flex;flex-direction:column;justify-content:center;gap:14px;\">\n      <div style=\"display:flex;align-items:center;gap:16px;\"><div style=\"width:120px;font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">59%</div><div style=\"height:26px;border-radius:8px;background:var(--verde);width:59%;\"></div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">Particulares (socios y donantes)</div></div>\n      <div style=\"display:flex;align-items:center;gap:16px;\"><div style=\"width:120px;font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">30%</div><div style=\"height:26px;border-radius:8px;background:#3ba896;width:30%;\"></div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">Empresas y fundaciones</div></div>\n      <div style=\"display:flex;align-items:center;gap:16px;\"><div style=\"width:120px;font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">8%</div><div style=\"height:26px;border-radius:8px;background:#8ec4ba;width:8%;\"></div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">Fondos públicos</div></div>\n      <div style=\"display:flex;align-items:center;gap:16px;\"><div style=\"width:120px;font-family:'Archivo',sans-serif;font-weight:700;font-size:28px;color:var(--verde-deep);\">2%+1%</div><div style=\"height:26px;border-radius:8px;background:#b7bab5;width:9%;\"></div><div style=\"font-size:22px;color:var(--gray);font-weight:600;\">Venta de servicios / financieros</div></div>\n    </div>\n    <div style=\"flex:0.8;display:flex;flex-direction:column;justify-content:center;background:var(--verde);border-radius:24px;box-shadow:var(--shadow-card-verde);padding:40px;color:#fff;\">\n      <div style=\"font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;\">Equipo</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;\">290</div>\n      <div style=\"font-size:24px;margin-top:8px;opacity:.9;\">trabajadores (176 Fundación + 114 BBRC), 66-68% mujeres</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;margin-top:28px;\">×3</div>\n      <div style=\"font-size:24px;margin-top:8px;opacity:.9;\">de retorno por cada euro invertido en captar nuevos socios</div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Fuente: FPM · Informe de Impacto 2025</div>\n</section>\n\n<section data-label=\"Becas, talento y embajadores\" data-screen-label=\"26\" data-speaker-notes=\"Cómo financiamos a jóvenes investigadores, y cómo los propios socios se implican en el día a día.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Comunidad y transparencia económica</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">Becas, talento investigador y socios embajadores</h2>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:stretch;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-size:var(--type-small);color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;\">Becas de investigación</div>\n      <p style=\"font-size:26px;color:var(--ink);font-weight:500;line-height:1.5;\">El <b>FPM-ALZ AD/ADRD Fellows Program</b> y el <b>Pasqual Maragall Researchers Programme (PMRP)</b> financian a jóvenes investigadores de Alzheimer. El <b>Premio Carles Colomer</b> amplía el modelo a la atrofia multisistémica, con ayudas de hasta 600.000 € por proyecto.</p>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-size:var(--type-small);color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;\">Socios y socias embajadores</div>\n      <p style=\"font-size:26px;color:var(--ink);font-weight:500;line-height:1.5;\">En 2025 se seleccionó a tres embajadores por su compromiso y vínculo con el Alzheimer: <b>Ana</b>, participante del Estudio Alfa; <b>Antonio</b>, de 59 años; y <b>Esther</b>, farmacéutica de 35 años.</p>\n    </div>\n  </div>\n</section>\n\n<section data-label=\"Creciendo socio a socio\" data-screen-label=\"27\" data-speaker-notes=\"De 147 socios en 2012 a 112.842 en 2025: el crecimiento que hace posible la investigación.\" style=\"display:flex;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"flex:1.1;display:flex;flex-direction:column;padding-right:56px;min-width:0;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Comunidad y transparencia económica</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:20px;\">Creciendo socio a socio</h2>\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:88px;color:var(--verde);line-height:1;\">147 → 112.842</div>\n    <p style=\"font-size:26px;color:var(--ink);line-height:1.5;font-weight:400;margin-top:24px;max-width:640px;\">De 147 socios en 2012 a 112.842 a cierre de 2025, con el hito de los 100.000 alcanzado durante el año: uno de los mayores apoyos ciudadanos activos a la investigación en España.</p>\n    <div style=\"background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px;margin-top:28px;\">\n      <div style=\"font-size:24px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;\">El papel de Wesser</div>\n      <p style=\"font-size:24px;color:var(--ink);font-weight:500;line-height:1.45;\">La colaboración con Wesser ha contribuido a este crecimiento, captando +29.000 nuevos socios.</p>\n    </div>\n  </div>\n  <div style=\"flex:0 0 600px;border-radius:28px;overflow:hidden;background:var(--paper-2);box-shadow:var(--shadow-card);\">\n    <img src=\"ed6cb1ab-adc4-4b27-a064-8df499d1a5ca\" alt=\"Comunidad de socios\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n  </div>\n</section>\n\n<section data-label=\"Divisor · Argumentario de captación\" data-screen-label=\"28\" data-speaker-notes=\"Sexta sección: cómo transmitir todo lo anterior en una conversación de minuto y medio.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 8% 10%,rgba(122,178,59,.12),transparent 58%),var(--beige);padding:0 var(--pad-x);font-family:'Public Sans',sans-serif;position:relative;overflow:hidden;\">\n  <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:280px;color:var(--beige-2);position:absolute;right:60px;top:50%;transform:translateY(-50%);line-height:1;\">06</span>\n  <div style=\"position:relative;\">\n    <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:24px;\">Sección 06</div>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-hero);color:var(--ink);letter-spacing:-.02em;max-width:1300px;\">Argumentario de captación</h2>\n    <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:28px;max-width:1200px;\">Cómo transmitir todo lo anterior en una conversación de minuto y medio.</p>\n    <div style=\"display:flex;gap:8px;margin-top:52px;\"><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:7px;height:7px;border-radius:4px;background:rgba(68,68,68,.14);\"></span><span style=\"width:26px;height:7px;border-radius:4px;background:var(--verde);\"></span></div>\n  </div>\n</section>\n\n<section data-label=\"Cómo contarlo: el guion\" data-screen-label=\"29\" data-speaker-notes=\"El gancho inicial pide permiso y promete brevedad: minuto y medio.\" style=\"display:flex;flex-direction:column;justify-content:center;background:radial-gradient(1300px 850px at 10% -14%,rgba(122,178,59,.1),transparent 58%),var(--beige);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;\">Argumentario · El guion</div>\n  <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:52px;color:var(--ink);line-height:1.3;max-width:1550px;\">\"¿Te puedo contar algo de minuto y medio? Es sobre el Alzheimer, y probablemente no sepas que empieza mucho antes de lo que crees.\"</p>\n  <p style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;margin-top:44px;max-width:1300px;\">Así empieza el discurso de captación: pide permiso, promete brevedad y anuncia algo que no se sabe, no una lista de cifras.</p>\n</section>\n\n<section data-label=\"El relato — el Alzheimer silencioso\" data-screen-label=\"30\" data-speaker-notes=\"El Alzheimer empieza hasta 20 años antes de los primeros olvidos, en silencio.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pa
