d-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario · El relato</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">El relato — el Alzheimer silencioso</h2>\n  <div style=\"display:flex;gap:64px;flex:1;align-items:center;\">\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:104px;color:var(--verde);line-height:1;\">20 años</div>\n      <p style=\"font-size:var(--type-body);color:var(--ink);line-height:1.55;margin-top:24px;\">antes de los primeros olvidos, el daño ya se acumula en silencio, sin ningún síntoma. Alguien que hoy tiene 50 o 55 años y se siente perfectamente bien podría estar ya en ese proceso sin saberlo.</p>\n    </div>\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:104px;color:var(--verde);line-height:1;\">1 de cada 2</div>\n      <p style=\"font-size:var(--type-body);color:var(--ink);line-height:1.55;margin-top:24px;\">personas verá su vida afectada por esta enfermedad si nada cambia: bien porque la desarrolle, bien porque cuide a alguien que la tiene. No es \"cosa de otros\". Es, literalmente, una moneda al aire para cualquiera.</p>\n    </div>\n  </div>\n</section>\n\n<section data-label=\"El relato — el avance de 2025\" data-screen-label=\"31\" data-speaker-notes=\"Un análisis de sangre detecta el Alzheimer con más del 90% de precisión: la pieza que conecta diagnóstico y tratamiento a tiempo.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario · El relato</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">El relato — el avance de 2025</h2>\n  <div style=\"display:flex;gap:56px;flex:1;align-items:center;\">\n    <div style=\"flex:0.7;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--verde);border-radius:24px;box-shadow:var(--shadow-card-verde);padding:44px;color:#fff;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:96px;\">&gt;90%</div>\n      <div style=\"font-size:26px;font-weight:600;margin-top:12px;text-align:center;\">de precisión, publicado en Nature Medicine</div>\n    </div>\n    <p style=\"flex:1;font-size:var(--type-body);color:var(--ink);line-height:1.55;\">Es comparable a una punción lumbar, pero sin necesidad de sedación. Esto importa porque ahora mismo existen fármacos que pueden modificar el curso de la enfermedad (Lecanemab, Donanemab), pero solo alrededor del <b>6% de los pacientes</b> son elegibles según estudios europeos, porque el diagnóstico normalmente llega cuando el daño ya está muy avanzado. Una detección más temprana cambiaría eso por completo.</p>\n  </div>\n</section>\n\n<section data-label=\"El relato — quién está detrás\" data-screen-label=\"32\" data-speaker-notes=\"La Fundación Pasqual Maragall y el BBRC, y todo lo que hacen más allá del laboratorio.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario · El relato</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);max-width:1500px;\">El relato — quién está detrás</h2>\n  <div style=\"display:flex;flex:1;gap:0;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">La cohorte</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;color:var(--ink);margin-top:10px;\">+2.700</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">personas en seguimiento desde hace años (Estudio Alfa)</div>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">El algoritmo</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;color:var(--ink);margin-top:10px;\">31 M€</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">ALFA10, conectado a un consorcio europeo de 6 países + EE.UU.</div>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Sin animales</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;color:var(--ink);margin-top:10px;\">Minicerebros</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">investigación con organoides a partir de una muestra de sangre</div>\n    </div>\n    <div style=\"flex:1;display:flex;flex-direction:column;border-left:3px solid var(--border);padding-left:32px;padding-right:20px;position:relative;\">\n      <div style=\"position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--verde);\"></div>\n      <div style=\"font-size:22px;color:var(--verde-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Más allá del laboratorio</div>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;color:var(--ink);margin-top:10px;\">45%</div>\n      <div style=\"font-size:22px;color:var(--gray);font-weight:500;margin-top:10px;line-height:1.4;\">de las demencias, potencialmente prevenibles con hábitos cotidianos</div>\n    </div>\n  </div>\n  <div style=\"border-top:1px solid var(--border);padding-top:24px;margin-top:24px;font-size:var(--type-small);color:var(--gray-soft);font-weight:600;\">Y no es solo investigación de laboratorio: la Fundación ya ha acompañado gratis a más de 1.700 personas que cuidan o han cuidado a un familiar con Alzheimer.</div>\n</section>\n\n<section data-label=\"Por qué hacerse socio (I)\" data-screen-label=\"33\" data-speaker-notes=\"Tres razones de peso: la ciencia que conecta diagnóstico y tratamiento, que a casi todos nos toca, y la escala europea real.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Por qué hacerse socio (I)</h2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;flex:1;justify-content:center;\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">1</div>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">Detectar antes, tratar a tiempo</div><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">Un análisis de sangre detecta el Alzheimer con más del 90% de precisión, comparable a la punción lumbar pero accesible y poco invasivo. Solo un 6% de los pacientes son hoy elegibles para los nuevos fármacos, porque el diagnóstico llega tarde: ese análisis es la pieza que conecta diagnóstico y tratamiento a tiempo.</div></div>\n    </div>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">2</div>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">Esto le toca a casi todo el mundo</div><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">2 de cada 3 españoles tienen o han tenido en su entorno a alguien con Alzheimer. Para quienes ya cuidan a esa persona, la Fundación ofrece Grupos Terapéuticos gratuitos: 184 grupos y 1.723 personas acompañadas desde 2013.</div></div>\n    </div>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:28px 32px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">3</div>\n      <div><div style=\"font-size:26px;font-weight:700;color:var(--ink);\">Escala europea real</div><div style=\"font-size:24px;color:var(--gray);margin-top:8px;line-height:1.4;\">ALFA10, el proyecto más ambicioso del BBRC para esta década, está conectado al consorcio europeo AD-RIDDLE: 31 millones de euros y 6 países europeos más EE.UU. para llevar estos avances a los sistemas de salud reales.</div></div>\n    </div>\n  </div>\n</section>\n\n<section data-label=\"Por qué hacerse socio (II)\" data-screen-label=\"34\" data-speaker-notes=\"Ciencia sin experimentación animal, y hábitos cotidianos que también cambian el riesgo.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Argumentario</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Por qué hacerse socio (II)</h2>\n  <div style=\"display:flex;gap:40px;flex:1;align-items:center;justify-content:center;\">\n    <div style=\"flex:1;display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;border-top:5px solid var(--verde);\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">4</div>\n      <div><div style=\"font-size:27px;font-weight:700;color:var(--ink);\">Ciencia sin experimentación animal</div><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.45;\">El BBRC ha creado \"minicerebros\" (organoides cerebrales cultivados a partir de una simple muestra de sangre) que permiten simular el Alzheimer y probar tratamientos en un entorno controlado.</div></div>\n    </div>\n    <div style=\"flex:1;display:flex;gap:28px;align-items:flex-start;background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow-card);padding:36px;\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:40px;color:var(--verde-deep);flex-shrink:0;\">5</div>\n      <div><div style=\"font-size:27px;font-weight:700;color:var(--ink);\">No es solo ciencia de laboratorio</div><div style=\"font-size:24px;color:var(--gray);margin-top:10px;line-height:1.45;\">Hasta el 45% de los casos de demencia son potencialmente prevenibles actuando sobre hábitos cotidianos. El estudio PENSA (hábitos + té verde) mejora la cognición hasta ×4,5 y reduce un 25% el riesgo de demencia.</div></div>\n    </div>\n  </div>\n</section>\n\n<section data-label=\"El cierre y la llamada a la acción\" data-screen-label=\"35\" data-speaker-notes=\"El cierre invita a formar parte, con una cuota concreta y accesible.\" style=\"display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(1300px 850px at 10% -14%,rgba(122,178,59,.1),transparent 58%),var(--beige);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;text-align:center;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;\">Argumentario · El cierre</div>\n  <p style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:42px;color:var(--ink);line-height:1.4;max-width:1600px;\">\"El 57% del presupuesto conjunto de la Fundación y el BBRC va directo a investigación. Por unos 12 euros al mes, formas parte de los 112.842 socios que hacen posible que, la próxima vez que alguien tenga ese 50% de probabilidades, exista una forma de saberlo a tiempo.\"</p>\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-top:56px;\">\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:100px;color:var(--verde);\">~12 €</div>\n    <div style=\"font-size:var(--type-subtitle);color:var(--gray);font-weight:500;\">al mes (140-150 €/año)</div>\n  </div>\n  <p style=\"font-size:32px;color:var(--ink);font-weight:600;margin-top:40px;\">¿Te animas?</p>\n</section>\n\n<section data-label=\"Lo esencial en una diapositiva\" data-screen-label=\"36\" data-speaker-notes=\"Ficha resumen para repasar antes de una conversación de captación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Cierre</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:var(--gap-title);\">Lo esencial en una diapositiva</h2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px 20px;flex:1;align-content:center;\">\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">2008</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Fundación (BBRC de investigación)</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">112.842</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Socios y socias a cierre de 2025</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">93 M€</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Invertidos en investigación 2013-2025</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">&gt;90%</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Precisión del análisis de sangre (Nature Medicine)</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">2.743</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Participantes del Estudio Alfa</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">900.000</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Personas con Alzheimer u otra demencia en España</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">57%</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">Del presupuesto va directo a investigación</div></div>\n    <div style=\"background:var(--paper-2);border-radius:18px;box-shadow:var(--shadow-card);padding:24px;\"><div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:36px;color:var(--verde-deep);\">6%</div><div style=\"font-size:24px;color:var(--gray);font-weight:600;margin-top:8px;\">De los pacientes son hoy elegibles para los nuevos fármacos</div></div>\n  </div>\n</section>\n\n<section data-label=\"Vídeos de apoyo\" data-screen-label=\"37\" data-speaker-notes=\"Material audiovisual útil para preparar visitas y conversaciones de captación.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Cierre</div>\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);color:var(--ink);margin-bottom:12px;\">Vídeos de apoyo</h2>\n  <p style=\"font-size:var(--type-body);color:var(--gray);font-weight:500;margin-bottom:var(--gap-title);max-width:1400px;\">Testimonios y divulgación científica para reforzar la formación y preparar conversaciones</p>\n  <div style=\"display:flex;flex-direction:column;flex:1;justify-content:center;\">\n    <a href=\"https://www.youtube.com/watch?v=_jY8QtNU1b4\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">Por un futuro sin Alzheimer</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Spot institucional · 4:19 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=DsQ2T9Ruwxs\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">Día Mundial del Alzheimer — Para que nadie pierda su identidad</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Spot Día Mundial · 1:15 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=gHHw7htuTXw\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">100.000 socios — Esther y Víctor Manuel</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Testimonio de socios · 2:01 · 2025</div></a>\n    <a href=\"https://www.youtube.com/watch?v=YGWpLGXa1NY\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">100.000 socios — Montserrat y Enrique</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Testimonio de socios · 1:56 · 2025</div></a>\n    <a href=\"https://www.youtube.com/watch?v=BGp65TN5OVQ\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">¿Es posible detectar el Alzheimer antes de los primeros síntomas?</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Divulgación científica · 1:48 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=9t1huEf2cUw\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">¿Cómo empieza el Alzheimer? — Conoce la Investigación</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Divulgación científica · 1:57 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=UR4lZmpxUwU\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">El camino del Alzheimer — Cap. 1: Poniendo nombre al Alzheimer</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Serie divulgativa · 1:11 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=cA6BRL0Txdo\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">El camino del Alzheimer — Cap. 2: La principal causa de demencia</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Serie divulgativa · 1:17 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=T8tuK6E_06s\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">El camino del Alzheimer — Cap. 3: Las proteínas beta-amiloide y tau</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Serie divulgativa · 1:21 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=20eUq_gobt4\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">El camino del Alzheimer — Cap. 4: Técnicas de neuroimagen</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Serie divulgativa · 1:14 · 2024</div></a>\n    <a href=\"https://www.youtube.com/watch?v=7SETRpdQsko\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:28px;padding:12px 0;text-decoration:none;\" style-hover=\"background:var(--paper-2);\"><div style=\"flex:1;font-size:23px;font-weight:600;color:var(--ink);\">El camino del Alzheimer — Cap. 5: Cuando te cuidas, el Alzheimer da un paso atrás</div><div style=\"font-size:22px;color:var(--gray);width:320px;\">Serie divulgativa · 1:05 · 2024</div></a>\n  </div>\n</section>\n\n<section data-label=\"Fuentes y verificación\" data-screen-label=\"38\" data-speaker-notes=\"Todas las cifras citadas provienen de estas fuentes; útil para responder con precisión.\" style=\"display:flex;flex-direction:column;background:radial-gradient(1300px 850px at 90% -16%,rgba(122,178,59,.06),transparent 55%),var(--paper);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);font-family:'Public Sans',sans-serif;\">\n  <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:var(--type-eyebrow);color:var(--verde-deep);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;\">Cierre</div>\n  <h2 style=\"font-fam
